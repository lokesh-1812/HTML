<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Transform Image Gallery</h1>

    <div class="container">

        <div class="diamond top-left">
            <img src="https://images.unsplash.com/photo-1619566636858-adf3ef46400b?w=600" alt="Apple">
        </div>

        <div class="diamond top-right">
            <img src="https://images.unsplash.com/photo-1574226516831-e1dff420e37f?w=600" alt="Orange">
        </div>

        <div class="diamond center">
            <img src="https://images.unsplash.com/photo-1610832958506-aa56368176cf?w=600" alt="Mixed Fruits">
        </div>

        <div class="diamond bottom-left">
            <img src="https://images.unsplash.com/photo-1567306226416-28f0efdc88ce?w=600" alt="Banana">
        </div>

        <div class="diamond bottom-right">
            <img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=600" alt="Fruit Bowl">
        </div>

    </div>

</body>
</html>
